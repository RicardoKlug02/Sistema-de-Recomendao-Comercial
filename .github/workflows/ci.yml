name: CI com Matrix e Paralelismo

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    
    # O Strategy Matrix cria um job para cada combinação abaixo
    strategy:
      fail-fast: false # Não cancela os outros se um falhar
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12']

    steps:
      - name: Checkout do código
        uses: actions/checkout@v3

      - name: Configurar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r src/backend/requirements.txt
          pip install pytest

      - name: Rodar testes com Pytest
        # O paralelismo interno do Pytest (-n auto) acelera ainda mais
        run: |
          pip install pytest-xdist
          pytest src/backend/tests/ -n auto