services:
  db:
    image: postgres:16.8-alpine
    environment:
      POSTGRES_DB: rioverde
      POSTGRES_USER: rioverde
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rioverde_local}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rioverde -d rioverde"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
